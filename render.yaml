services:
  - type: web
    name: smart-service-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROVIDER_SEARCH_RADIUS_KM
        value: "50"
